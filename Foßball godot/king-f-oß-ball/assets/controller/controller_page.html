<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KING CONTROLLER</title>
<style>
  :root{--gold:#d4af37;--gold-d:#8f7424;--red:#c0272d;--ink:#0b0b0d;--panel:#16161a;--text:#f2ead3;--muted:#9a9384;
        --stick:min(40vmin,176px);--u:min(20vmin,86px);--u2:min(28vmin,120px);--pillh:min(13vmin,56px);--pillw:min(22vmin,96px)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;touch-action:none}
  html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ink);
    color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans",sans-serif}
  body{background:radial-gradient(120% 90% at 50% 120%,#241a05 0%,var(--ink) 60%)}
  #top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:max(env(safe-area-inset-top),6px) max(env(safe-area-inset-right),10px) 6px max(env(safe-area-inset-left),10px);z-index:20}
  #status{flex:1 1 auto;min-width:0;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid #2c2c33;font-size:13px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:8px;background:var(--muted)}
  #status.ok::before{background:#3ddc84}#status.warn::before{background:var(--gold)}#status.bad::before{background:var(--red)}
  .chip{flex:0 0 auto;padding:7px 12px;border-radius:10px;background:var(--panel);border:1px solid #2c2c33;color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
  .chip.on{border-color:var(--gold);color:var(--gold)}
  #pause{background:#2a0c0e;border-color:var(--red);color:#ffd9d6;min-width:76px}
  #pause.active{background:var(--red)}
  #gear{font-size:16px;line-height:1;padding:8px 13px}
  #settings{position:fixed;top:calc(max(env(safe-area-inset-top),6px) + 44px);inset-inline-end:max(env(safe-area-inset-right),10px);
    display:none;flex-direction:column;gap:8px;padding:12px;background:var(--panel);border:1px solid #2c2c33;border-radius:14px;z-index:25;
    box-shadow:0 6px 24px rgba(0,0,0,.6)}
  #settings.show{display:flex}
  #langs{display:flex;gap:6px;direction:ltr}
  #disc{min-width:110px;text-align:center}
  #ctl{display:flex;flex-direction:column;gap:7px;max-height:calc(100vh - 110px);overflow-y:auto;min-width:min(78vw,330px);touch-action:pan-y}
  #ctl .lab{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
  #ctl .line{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  #ctl .line span{flex:0 0 38%}
  #ctl input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--gold);touch-action:pan-y}
  #ctl .chips{display:flex;flex-wrap:wrap;gap:6px}
  #ctl select{background:var(--panel);color:var(--text);border:1px solid #2c2c33;border-radius:8px;padding:6px}
  #stage.left{flex-direction:row-reverse}
  #stage.left #btns{align-items:flex-start}
  .btn.hidden{display:none}
  /* centred and click-through: it can stay open during play, the stick and buttons underneath keep working */
  #dash{position:fixed;top:calc(max(env(safe-area-inset-top),6px) + 44px);left:50%;transform:translateX(-50%);width:min(62vw,470px);height:min(52vh,230px);
    display:none;gap:12px;padding:10px;background:rgba(22,22,26,.88);border:1px solid #2c2c33;border-radius:14px;z-index:22;direction:ltr;overflow:hidden;pointer-events:none}
  #dash.show{display:flex}
  #dcol{flex:1 1 55%;min-width:0;display:flex;flex-direction:column;gap:8px}
  #dscore{font-size:clamp(26px,9vmin,40px);font-weight:800;text-align:center;color:var(--gold);letter-spacing:.04em}
  #dclock{font-size:13px;color:var(--muted);text-align:center;font-weight:700}
  .stat{display:flex;justify-content:space-between;font-size:13px;font-weight:700;gap:8px}
  .stat span:nth-child(2){color:var(--muted);flex:1;text-align:center}
  #dposs{height:8px;border-radius:4px;background:var(--red);overflow:hidden}
  #dposs i{display:block;height:100%;background:var(--gold)}
  #dfeed{flex:1;overflow:hidden;font-size:12px;line-height:1.5;color:var(--text);min-height:0}
  #dfeed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dmapwrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  #dmap{height:100%;max-height:100%;aspect-ratio:68/105;background:#0e2a12;border:1px solid #2c2c33;border-radius:6px}
  #dash .empty{margin:auto;color:var(--muted);font-weight:700;text-align:center}
  #stage{position:fixed;inset:46px 0 0 0;display:flex;align-items:flex-end;justify-content:space-between;direction:ltr;
    padding:10px max(env(safe-area-inset-right),18px) max(env(safe-area-inset-bottom),16px) max(env(safe-area-inset-left),18px)}
  .stick{width:var(--stick);height:var(--stick);border-radius:50%;position:relative;background:rgba(212,175,55,.07);border:2px solid rgba(212,175,55,.45)}
  .stick::after{content:"";position:absolute;inset:26%;border-radius:50%;border:1px dashed rgba(212,175,55,.25)}
  .knob{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 35% 30%,#f3d77a,var(--gold) 55%,var(--gold-d));box-shadow:0 2px 10px rgba(0,0,0,.6);transform:translate(-50%,-50%)}
  /* tiered action cluster: small utility pills on top, medium circles, then the two big main actions */
  #btns{display:flex;flex-direction:column;align-items:flex-end;gap:clamp(8px,2vmin,14px)}
  .row{display:flex;gap:clamp(6px,1.8vmin,12px);align-items:center}
  .btn{background:var(--panel);border:2px solid rgba(212,175,55,.5);color:var(--text);font-weight:800;letter-spacing:.02em;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;line-height:1.15;overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .btn.small{width:var(--pillw);height:var(--pillh);border-radius:999px;font-size:clamp(10px,2.6vmin,12px)}
  .btn.mid{width:var(--u);height:var(--u);border-radius:50%;font-size:clamp(11px,2.9vmin,14px)}
  .btn.big{width:var(--u2);height:var(--u2);border-radius:50%;font-size:clamp(13px,3.6vmin,17px)}
  .btn.main{background:linear-gradient(160deg,#3a2c08,#1b1403);border-color:var(--gold);color:#ffe9a6}
  .btn.active{background:var(--gold);border-color:#fff3c2;color:#1a1403;transform:scale(.95)}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;text-align:center;
    background:rgba(8,8,10,.9);z-index:30;font-size:18px;font-weight:700;line-height:1.5}
  #overlay.show{display:flex}
  #overlay small{display:block;font-size:14px;font-weight:500;color:var(--muted);max-width:30em}
  #overlay .act{padding:12px 26px;border-radius:12px;background:var(--gold);color:#1a1403;border:0;font-size:16px;font-weight:800}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--ink);z-index:40;font-size:18px;font-weight:700;text-align:center;padding:24px}
  #rotate i{font-style:normal;font-size:54px}
  @media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="top">
  <div id="status" role="status" aria-live="polite">…</div>
  <button class="chip" id="pause" type="button"></button>
  <button class="chip" id="dashbtn" type="button">📊</button>
  <button class="chip" id="gear" type="button">⚙</button>
</div>
<div id="settings">
  <div id="langs"></div>
  <div id="ctl"></div>
  <button class="chip" id="disc" type="button"></button>
</div>
<div id="stage">
  <div class="stick" id="stick" aria-label="joystick"><div class="knob" id="knob"></div></div>
  <div id="btns"></div>
</div>
<div id="dash" aria-live="off"><div class="empty" id="dempty"></div>
  <div id="dcol" style="display:none"><div id="dscore">0 - 0</div><div id="dclock"></div><div id="dposs"><i style="width:50%"></i></div>
    <div class="stat"><span id="dp1"></span><span id="dplab"></span><span id="dp2"></span></div>
    <div class="stat"><span id="ds1"></span><span id="dslab"></span><span id="ds2"></span></div>
    <div class="stat"><span id="dc1"></span><span id="dclab"></span><span id="dc2"></span></div>
    <div id="dfeed"></div></div>
  <div id="dmapwrap" style="display:none"><canvas id="dmap" width="136" height="210"></canvas></div></div>
<div id="overlay"><div id="ovtext"></div><small id="ovhint"></small><button class="act" id="ovact" type="button" style="display:none"></button></div>
<div id="rotate"><i>⟳</i><span id="rotatetxt"></span></div>
<script>
'use strict';
/* KING CONTROLLER page — protocol version 2 (see docs/KING_CONTROLLER_ARCHITECTURE.md).
   Sends the FULL controller state (stick + held buttons) so a dropped packet can never leave a button stuck.
   No client clock is used for anything: the PC stamps packets with its own arrival time.
   Layout v2 (DLS style): the eight actions are tiered instead of one flat 3x3 wall of circles —
   SPRINT/SWITCH/TACKLE as small pills, CROSS/LOB/THROUGH as medium circles, PASS/SHOOT as the two big
   main buttons; languages and disconnect live inside a settings menu to keep the top bar clean. */
const PROTOCOL = 2;
const WS_URL = 'ws://' + location.hostname + ':__WS_PORT__/';
const HEARTBEAT_MS = 1000, TIMEOUT_MS = 3000, SEND_MS = 33, IDLE_SEND_MS = 500, GIVE_UP_MS = 120000;
let DEAD = 0.12;

const I18N = {
  en: {dir:'ltr', name:'English',
    a:{sprint:'SPRINT',tackle:'TACKLE',switch_player:'SWITCH',pass:'PASS',shoot:'SHOOT',lob_pass:'LOB',through_pass:'THROUGH',cross:'CROSS',pause:'PAUSE'},
    s:{disconnected:'Disconnected',connecting:'Connecting…',pairing:'Pairing…',connected:'Connected',reconnecting:'Reconnecting…',lost:'Connection lost',revoked:'Removed by the PC'},
    ui:{disc:'Disconnect',rotate:'Rotate your phone to landscape',reconnect:'Reconnect',lang:'Language',player:'Player',settings:'Settings',ctl:'Controls',hand:'Hand',hl:'Left',hr:'Right',size:'Button size',opac:'Opacity',dz:'Dead zone',sens:'Sensitivity',buttons:'Buttons',hap:'Vibration',hoff:'Off',hlight:'Light',hstrong:'Strong',hnone:'Not supported on this device',presets:'Presets',pdef:'Default',pleft:'Left-handed',pbig:'Big buttons',profile:'Profile',save:'Save',loadp:'Load',reset:'Reset',dash:'Match',nomatch:'Waiting for match data…',possl:'Possession',shotsl:'Shots (on target)',cardsl:'Cards',youl:'You',goal:'Goal',owng:'Own goal',yel:'Yellow card',redc:'Red card',subst:'Substitution',saved:'Save',pen:'Penalty'},
    e:{no_token:'Scan the QR code shown on the PC to pair.',token_expired:'The QR code expired. Scan the new code on the PC.',bad_token:'Invalid pairing code. Scan the QR code again.',
       too_many_attempts:'Too many attempts. Scan the new QR code on the PC.',no_slot:'The controller slot is taken. Remove the other phone on the PC first.',
       session_unknown:'This session has ended. Scan the QR code again.',session_expired:'This session expired. Scan the QR code again.',revoked:'The PC removed this controller.',
       bad_version:'This page and the game do not match. Update the game.',unreachable:'Cannot reach the game. Same Wi-Fi? Check the PC firewall.',gone:'Connection lost. Trying to reconnect.'}},
  de: {dir:'ltr', name:'Deutsch',
    a:{sprint:'SPRINT',tackle:'GRÄTSCHE',switch_player:'WECHSEL',pass:'PASS',shoot:'SCHUSS',lob_pass:'HEBER',through_pass:'STEILPASS',cross:'FLANKE',pause:'PAUSE'},
    s:{disconnected:'Getrennt',connecting:'Verbinde…',pairing:'Koppeln…',connected:'Verbunden',reconnecting:'Verbinde neu…',lost:'Verbindung verloren',revoked:'Vom PC entfernt'},
    ui:{disc:'Trennen',rotate:'Handy ins Querformat drehen',reconnect:'Neu verbinden',lang:'Sprache',player:'Spieler',settings:'Einstellungen',ctl:'Steuerung',hand:'Hand',hl:'Links',hr:'Rechts',size:'Tastengröße',opac:'Deckkraft',dz:'Totzone',sens:'Empfindlichkeit',buttons:'Tasten',hap:'Vibration',hoff:'Aus',hlight:'Leicht',hstrong:'Stark',hnone:'Auf diesem Gerät nicht unterstützt',presets:'Voreinstellungen',pdef:'Standard',pleft:'Linkshänder',pbig:'Große Tasten',profile:'Profil',save:'Speichern',loadp:'Laden',reset:'Zurücksetzen',dash:'Spiel',nomatch:'Warte auf Spieldaten…',possl:'Ballbesitz',shotsl:'Schüsse (aufs Tor)',cardsl:'Karten',youl:'Du',goal:'Tor',owng:'Eigentor',yel:'Gelbe Karte',redc:'Rote Karte',subst:'Wechsel',saved:'Parade',pen:'Elfmeter'},
    e:{no_token:'QR-Code am PC scannen, um zu koppeln.',token_expired:'Der QR-Code ist abgelaufen. Neuen Code am PC scannen.',bad_token:'Ungültiger Kopplungscode. QR-Code erneut scannen.',
       too_many_attempts:'Zu viele Versuche. Neuen QR-Code am PC scannen.',no_slot:'Der Controller-Platz ist belegt. Anderes Handy zuerst am PC entfernen.',
       session_unknown:'Diese Sitzung ist beendet. QR-Code erneut scannen.',session_expired:'Diese Sitzung ist abgelaufen. QR-Code erneut scannen.',revoked:'Der PC hat diesen Controller entfernt.',
       bad_version:'Seite und Spiel passen nicht zusammen. Spiel aktualisieren.',unreachable:'Spiel nicht erreichbar. Gleiches WLAN? PC-Firewall prüfen.',gone:'Verbindung verloren. Versuche neu zu verbinden.'}},
  ar: {dir:'rtl', name:'العربية',
    a:{sprint:'ركض',tackle:'تدخل',switch_player:'تبديل',pass:'تمريرة',shoot:'تسديد',lob_pass:'كرة عالية',through_pass:'تمريرة بينية',cross:'عرضية',pause:'إيقاف مؤقت'},
    s:{disconnected:'غير متصل',connecting:'جارٍ الاتصال…',pairing:'جارٍ الإقران…',connected:'متصل',reconnecting:'جارٍ إعادة الاتصال…',lost:'انقطع الاتصال',revoked:'أزاله الحاسوب'},
    ui:{disc:'قطع الاتصال',rotate:'أدر الهاتف إلى الوضع الأفقي',reconnect:'إعادة الاتصال',lang:'اللغة',player:'اللاعب',settings:'الإعدادات',ctl:'التحكم',hand:'اليد',hl:'يسار',hr:'يمين',size:'حجم الأزرار',opac:'الشفافية',dz:'المنطقة الميتة',sens:'الحساسية',buttons:'الأزرار',hap:'الاهتزاز',hoff:'إيقاف',hlight:'خفيف',hstrong:'قوي',hnone:'غير مدعوم على هذا الجهاز',presets:'إعدادات جاهزة',pdef:'افتراضي',pleft:'لاعب أعسر',pbig:'أزرار كبيرة',profile:'الملف',save:'حفظ',loadp:'تحميل',reset:'إعادة ضبط',dash:'المباراة',nomatch:'بانتظار بيانات المباراة…',possl:'الاستحواذ',shotsl:'التسديدات (على المرمى)',cardsl:'البطاقات',youl:'أنت',goal:'هدف',owng:'هدف عكسي',yel:'بطاقة صفراء',redc:'بطاقة حمراء',subst:'تبديل',saved:'تصدٍّ',pen:'ركلة جزاء'},
    e:{no_token:'امسح رمز QR الظاهر على الحاسوب للإقران.',token_expired:'انتهت صلاحية رمز QR. امسح الرمز الجديد على الحاسوب.',bad_token:'رمز الإقران غير صالح. امسح رمز QR من جديد.',
       too_many_attempts:'محاولات كثيرة. امسح رمز QR الجديد على الحاسوب.',no_slot:'خانة وحدة التحكم مشغولة. أزل الهاتف الآخر من الحاسوب أولًا.',
       session_unknown:'انتهت هذه الجلسة. امسح رمز QR من جديد.',session_expired:'انتهت صلاحية هذه الجلسة. امسح رمز QR من جديد.',revoked:'أزال الحاسوب وحدة التحكم هذه.',
       bad_version:'الصفحة لا تطابق اللعبة. حدّث اللعبة.',unreachable:'تعذّر الوصول إلى اللعبة. هل أنتما على شبكة Wi-Fi نفسها؟ افحص جدار حماية الحاسوب.',gone:'انقطع الاتصال. تجري محاولة إعادة الاتصال.'}}
};
/* Action rows, tiered. First row: small utility pills. Second: medium circles. Third: the two big main actions.
   Each entry is [action, isMainStyle]; the actions map 1:1 to the game protocol — nothing was removed,
   only re-arranged by importance. */
const ROWS = [
  {cls:'small', items:[['sprint',0],['switch_player',0],['tackle',0]]},
  {cls:'mid',   items:[['cross',0],['lob_pass',0],['through_pass',0]]},
  {cls:'big',   items:[['pass',1],['shoot',1]]}
];

const params = new URLSearchParams(location.search);
function store(k, v){ try{ if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); }catch(e){} }
function load(k){ try{ return sessionStorage.getItem(k) || ''; }catch(e){ return ''; } }
function lstore(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lload(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }

function pickLang(){
  const q = (params.get('lang')||'').toLowerCase();
  if (I18N[q]) return q;
  const saved = lload('kc_lang');
  if (I18N[saved]) return saved;
  for (const l of (navigator.languages || [navigator.language || 'en'])) {
    const p = String(l).toLowerCase().slice(0,2);
    if (I18N[p]) return p;
  }
  return 'en';
}
let lang = pickLang();
let T = I18N[lang];

/* ---- state ---- */
let ws = null, seq = 0, pingSeq = 0, authed = false, wantConnected = true, retryTimer = null, retryMs = 500, firstFail = 0, lastRx = 0;
let session = load('kc_session');
let token = params.get('t') || '';
let state = 'connecting', errKey = '', slotNo = 0;
const held = new Set();
let mx = 0, my = 0, dirty = true, lastSent = 0, lastPause = 0;
const btnEls = {};
const ptr = {};
let stickId = null;

const $ = id => document.getElementById(id);

/* ---- UI text ---- */
function applyLang(){
  T = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = T.dir;
  for (const a in btnEls) btnEls[a].textContent = T.a[a];
  $('pause').textContent = T.a.pause;
  $('disc').textContent = T.ui.disc;
  $('gear').setAttribute('aria-label', T.ui.settings);
  $('rotatetxt').textContent = T.ui.rotate;
  document.querySelectorAll('#langs .chip').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  render();
  if (typeof buildCtl === 'function' && $('ctl')) buildCtl();
  if (typeof renderDash === 'function' && $('dash').classList.contains('show')) renderDash();
}
function setLang(l){ lang = l; lstore('kc_lang', l); applyLang(); }
function render(){
  const st = $('status');
  st.textContent = (T.s[state] || state) + ((state === 'connected' && slotNo > 0) ? ' · ' + T.ui.player + ' ' + slotNo : '');
  st.className = {connected:'ok', connecting:'warn', pairing:'warn', reconnecting:'warn', lost:'bad', revoked:'bad', disconnected:'bad'}[state] || '';
  const ov = $('overlay');
  const blocking = (state === 'disconnected' || state === 'revoked' || state === 'lost');
  ov.classList.toggle('show', blocking);
  if (blocking) {
    $('ovtext').textContent = errKey && T.e[errKey] ? T.e[errKey] : (T.s[state] || '');
    $('ovhint').textContent = '';
    const act = $('ovact');
    act.style.display = (state === 'lost') ? '' : 'none';
    act.textContent = T.ui.reconnect;
  }
}
function setState(s, key){ state = s; errKey = key || ''; render(); }

/* ---- sending ---- */
function send(obj){ if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; } return false; }
function deviceName(){ return ('Phone ' + (navigator.platform || '')).trim().slice(0, 40); }
function sendInput(){
  if (!authed) return;
  const ok = send({v:PROTOCOL, type:'input', seq:seq++, move:{x:Math.round(mx*1000)/1000, y:Math.round(my*1000)/1000}, held:Array.from(held)});
  if (ok) { lastSent = performance.now(); dirty = false; }
}
function changed(){ dirty = true; sendInput(); }

/* ---- connection ---- */
function connect(){
  clearTimeout(retryTimer);
  if (ws) { try{ ws.onclose = null; ws.onmessage = null; ws.close(); }catch(e){} ws = null; }
  authed = false;
  if (!session && !token) { wantConnected = false; setState('disconnected', 'no_token'); return; }
  setState(session ? 'reconnecting' : 'connecting');
  try { ws = new WebSocket(WS_URL); } catch(e) { scheduleRetry(); return; }
  ws.onopen = () => {
    lastRx = performance.now();
    setState(session ? 'reconnecting' : 'pairing');
    if (session) send({v:PROTOCOL, type:'resume', session:session});
    else send({v:PROTOCOL, type:'pair', token:token, name:deviceName()});
  };
  ws.onmessage = onMessage;
  ws.onclose = onClose;
  ws.onerror = () => {};
}
function onMessage(ev){
  lastRx = performance.now();
  let m; try { m = JSON.parse(ev.data); } catch(e) { return; }
  if (!m || m.v !== PROTOCOL) { setState('disconnected', 'bad_version'); wantConnected = false; return; }
  if (m.type === 'paired') {
    session = m.session; store('kc_session', session); slotNo = (m.slot | 0) + 1;
    token = ''; try { history.replaceState(null, '', location.pathname); } catch(e) {}     // the one-time token is spent
    authed = true; seq = 0; retryMs = 500; firstFail = 0;
    setState('connected'); dirty = true; sendInput();
  } else if (m.type === 'pair_fail') {
    const r = m.reason || 'bad_token';
    authed = false;
    if (r === 'revoked') { endSession(); setState('revoked', 'revoked'); }
    else if (r === 'session_unknown' || r === 'session_expired') {
      session = ''; store('kc_session', null);
      if (token) { connect(); return; }          // a fresh QR token is still in the URL: pair instead of resuming
      wantConnected = false; setState('disconnected', r);
    } else { wantConnected = false; setState('disconnected', r); }
  } else if (m.type === 'revoked') {
    endSession(); setState('revoked', 'revoked');
  } else if (m.type === 'state') { onFeedState(m); }
  else if (m.type === 'event') { onFeedEvent(m); }
}
function endSession(){ wantConnected = false; session = ''; token = ''; store('kc_session', null); releaseAll(); try{ if (ws) ws.close(); }catch(e){} }
function onClose(){
  authed = false; releaseAll();
  if (!wantConnected) return;
  if (!firstFail) firstFail = performance.now();
  if (performance.now() - firstFail > GIVE_UP_MS) { setState('lost', 'gone'); return; }
  setState(session ? 'reconnecting' : 'connecting', (!session && retryMs > 1500) ? 'unreachable' : '');
  scheduleRetry();
}
function scheduleRetry(){ clearTimeout(retryTimer); retryTimer = setTimeout(connect, retryMs); retryMs = Math.min(retryMs * 1.7, 3000); }
function userReconnect(){ wantConnected = true; retryMs = 500; firstFail = 0; connect(); }
function userDisconnect(){
  closeSettings();
  if (authed) send({v:PROTOCOL, type:'bye'});
  wantConnected = false; session = ''; token = ''; store('kc_session', null); releaseAll();
  try { history.replaceState(null, '', location.pathname); } catch(e) {}
  try { if (ws) ws.close(); } catch(e) {}
  setState('disconnected', 'no_token');
}
setInterval(() => {                       // heartbeat + silence detection
  if (!ws || ws.readyState !== 1 || !authed) return;
  send({v:PROTOCOL, type:'ping', seq:pingSeq++});
  if (performance.now() - lastRx > TIMEOUT_MS) { try { ws.close(); } catch(e) {} }
}, HEARTBEAT_MS);
setInterval(() => {                       // state stream: 30 Hz while something is active, slow keep-alive when idle
  if (!authed) return;
  const active = held.size > 0 || mx !== 0 || my !== 0;
  if (dirty || active || performance.now() - lastSent >= IDLE_SEND_MS) sendInput();
}, SEND_MS);

/* ---- controls ---- */
function press(a){ if (!held.has(a)) { held.add(a); changed(); } }
function release(a){ if (held.delete(a)) changed(); }
function releaseAll(){
  held.clear(); mx = 0; my = 0; stickId = null; dirty = true;
  $('knob').style.transform = 'translate(-50%,-50%)';
  document.querySelectorAll('.btn.active, #pause.active').forEach(e => e.classList.remove('active'));
  for (const a in ptr) ptr[a] = null;
}
function bindButton(el, action){
  ptr[action] = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (ptr[action] !== null) return;
    ptr[action] = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch(_) {}
    el.classList.add('active'); press(action); buzz();
  });
  const end = e => {
    if (e.pointerId !== ptr[action]) return;
    ptr[action] = null; el.classList.remove('active'); release(action);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
const btns = $('btns');
for (const row of ROWS) {
  const r = document.createElement('div');
  r.className = 'row ' + row.cls;
  for (const [a, main] of row.items) {
    const d = document.createElement('div');
    d.className = 'btn ' + row.cls + (main ? ' main' : '');
    d.setAttribute('role', 'button'); d.dataset.a = a;
    r.appendChild(d); btnEls[a] = d; bindButton(d, a);
  }
  btns.appendChild(r);
}
/* Pause: one tap = one request. The button is held for 150 ms so the PC always sees a clean press edge, and a
   second tap within 500 ms is ignored (the PC debounces too). */
$('pause').addEventListener('pointerdown', e => {
  e.preventDefault();
  const now = performance.now();
  if (now - lastPause < 500) return;
  lastPause = now;
  $('pause').classList.add('active');
  press('pause');
  setTimeout(() => { release('pause'); $('pause').classList.remove('active'); }, 150);
});

/* ---- settings menu (languages + disconnect live here, not in the top bar) ---- */
function closeSettings(){ $('settings').classList.remove('show'); }
$('gear').addEventListener('click', () => { $('dash').classList.remove('show'); $('dashbtn').classList.remove('on'); $('settings').classList.toggle('show'); });
document.addEventListener('pointerdown', e => {
  const s = $('settings');
  if (s.classList.contains('show') && !s.contains(e.target) && e.target !== $('gear')) closeSettings();
}, true);

/* stick: screen convention (up = -1), radial dead zone, pointer capture */
const stickEl = $('stick');
function updateStick(e){
  const r = stickEl.getBoundingClientRect();
  const R = r.width * 0.5 * 0.78;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > R) { dx *= R / len; dy *= R / len; }
  $('knob').style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
  let nx = dx / R, ny = dy / R;
  const m = Math.hypot(nx, ny);
  if (m < DEAD) { nx = 0; ny = 0; } else { const k = (m - DEAD) / (1 - DEAD) / m * prefs.sens; nx = Math.max(-1, Math.min(1, nx * k)); ny = Math.max(-1, Math.min(1, ny * k)); }
  if (nx !== mx || ny !== my) { mx = nx; my = ny; changed(); }
}
function stickEnd(e){
  if (e.pointerId !== stickId) return;
  stickId = null; $('knob').style.transform = 'translate(-50%,-50%)';
  if (mx !== 0 || my !== 0) { mx = 0; my = 0; changed(); }
}
stickEl.addEventListener('pointerdown', e => { e.preventDefault(); if (stickId !== null) return; stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch(_) {} updateStick(e); });
stickEl.addEventListener('pointermove', e => { if (e.pointerId === stickId) { e.preventDefault(); updateStick(e); } });
stickEl.addEventListener('pointerup', stickEnd);
stickEl.addEventListener('pointercancel', stickEnd);
stickEl.addEventListener('lostpointercapture', stickEnd);

/* ---- no accidental zoom / scroll / selection ---- */
document.addEventListener('touchmove', e => { if (!(e.target.closest && e.target.closest('#settings'))) e.preventDefault(); }, {passive:false});
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
['gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart','dragstart'].forEach(n => document.addEventListener(n, e => e.preventDefault()));

/* ---- never leave an input stuck ---- */
window.addEventListener('blur', () => { releaseAll(); changed(); });
window.addEventListener('pagehide', () => { releaseAll(); changed(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); changed(); } });
window.addEventListener('orientationchange', () => { releaseAll(); changed(); });


/* ---- control preferences (this phone only; nothing is sent to the PC) ----
   hand, size, opacity, dead zone, sensitivity, hidden buttons, vibration, 3 profile slots and presets. */
const DEFAULTS = {hand:'right', size:1, opac:1, dz:0.12, sens:1, hidden:[], hap:'light'};
const HIDEABLE = ['sprint','switch_player','tackle','cross','lob_pass','through_pass'];   // pass / shoot always stay
const PRESETS = {pdef:{}, pleft:{hand:'left'}, pbig:{size:1.3, opac:0.9}};
function sane(o){
  const d = Object.assign({}, DEFAULTS, (o && typeof o === 'object') ? o : {});
  const n = (v, lo, hi, dv) => (typeof v === 'number' && isFinite(v)) ? Math.min(hi, Math.max(lo, v)) : dv;
  return {hand: d.hand === 'left' ? 'left' : 'right', size: n(d.size, 0.7, 1.4, 1), opac: n(d.opac, 0.35, 1, 1),
          dz: n(d.dz, 0.04, 0.30, 0.12), sens: n(d.sens, 0.7, 1.5, 1),
          hidden: Array.isArray(d.hidden) ? d.hidden.filter(a => HIDEABLE.includes(a)) : [],
          hap: ['off','light','strong'].includes(d.hap) ? d.hap : 'light'};
}
function readJSON(k){ try { return JSON.parse(lload(k) || 'null'); } catch(e) { return null; } }
let prefs = sane(readJSON('kc_prefs'));
function savePrefs(){ lstore('kc_prefs', JSON.stringify(prefs)); }
const canVibrate = typeof navigator.vibrate === 'function';
function buzz(kind){
  if (!canVibrate || prefs.hap === 'off') return;
  const strong = prefs.hap === 'strong';
  const pat = kind === 'goal' ? (strong ? [70, 50, 70, 50, 160] : [60, 40, 60]) : kind === 'concede' ? (strong ? [220] : [110])
            : kind === 'long' ? (strong ? 90 : 50) : (strong ? 22 : 9);
  try { navigator.vibrate(pat); } catch(e) {}
}
function applyPrefs(){
  DEAD = prefs.dz;
  $('stage').classList.toggle('left', prefs.hand === 'left');
  document.documentElement.style.setProperty('--u', 'calc(min(20vmin,86px) * ' + prefs.size + ')');
  document.documentElement.style.setProperty('--u2', 'calc(min(28vmin,120px) * ' + prefs.size + ')');
  document.documentElement.style.setProperty('--pillh', 'calc(min(13vmin,56px) * ' + prefs.size + ')');
  document.documentElement.style.setProperty('--pillw', 'calc(min(22vmin,96px) * ' + prefs.size + ')');
  $('btns').style.opacity = prefs.opac; $('stick').style.opacity = prefs.opac;
  for (const a in btnEls) {
    const hide = prefs.hidden.includes(a);
    btnEls[a].classList.toggle('hidden', hide);
    if (hide && held.has(a)) release(a);
  }
  savePrefs();
}
function buildCtl(){
  const box = $('ctl'); box.textContent = '';
  const U = T.ui;
  const lab = t => { const d = document.createElement('div'); d.className = 'lab'; d.textContent = t; box.appendChild(d); };
  const chipRow = (items, isOn, onClick) => {
    const r = document.createElement('div'); r.className = 'chips';
    for (const [id, text] of items) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (isOn(id) ? ' on' : ''); b.textContent = text; b.dataset.id = id;
      b.addEventListener('click', () => { onClick(id); applyPrefs(); buildCtl(); }); r.appendChild(b);
    }
    box.appendChild(r);
  };
  const slider = (key, text, lo, hi, step) => {
    const l = document.createElement('label'); l.className = 'line';
    const sp = document.createElement('span'); sp.textContent = text;
    const i = document.createElement('input'); i.type = 'range'; i.min = lo; i.max = hi; i.step = step; i.value = prefs[key]; i.id = 'pref_' + key;
    i.addEventListener('input', () => { prefs[key] = parseFloat(i.value); applyPrefs(); });
    l.appendChild(sp); l.appendChild(i); box.appendChild(l);
  };
  lab(U.ctl);
  chipRow([['left', U.hl], ['right', U.hr]], id => prefs.hand === id, id => { prefs.hand = id; });
  slider('size', U.size, 0.7, 1.4, 0.05); slider('opac', U.opac, 0.35, 1, 0.05);
  slider('dz', U.dz, 0.04, 0.30, 0.01); slider('sens', U.sens, 0.7, 1.5, 0.05);
  lab(U.buttons);
  chipRow(HIDEABLE.map(a => [a, T.a[a]]), id => !prefs.hidden.includes(id),
          id => { prefs.hidden = prefs.hidden.includes(id) ? prefs.hidden.filter(x => x !== id) : prefs.hidden.concat(id); });
  lab(U.hap + (canVibrate ? '' : ' — ' + U.hnone));
  if (canVibrate) chipRow([['off', U.hoff], ['light', U.hlight], ['strong', U.hstrong]], id => prefs.hap === id, id => { prefs.hap = id; });
  lab(U.presets);
  chipRow(Object.keys(PRESETS).map(k => [k, U[k]]), () => false, id => { prefs = sane(Object.assign({}, DEFAULTS, PRESETS[id])); });
  lab(U.profile);
  const row = document.createElement('div'); row.className = 'chips';
  const sel = document.createElement('select'); sel.id = 'profsel';
  for (const n of [1, 2, 3]) { const o = document.createElement('option'); o.value = n; o.textContent = U.profile + ' ' + n; sel.appendChild(o); }
  sel.value = lload('kc_profile_sel') || '1';
  sel.addEventListener('change', () => lstore('kc_profile_sel', sel.value));
  const sv = document.createElement('button'); sv.type = 'button'; sv.className = 'chip'; sv.id = 'profsave'; sv.textContent = U.save;
  sv.addEventListener('click', () => lstore('kc_profile_' + sel.value, JSON.stringify(prefs)));
  const ld = document.createElement('button'); ld.type = 'button'; ld.className = 'chip'; ld.id = 'profload'; ld.textContent = U.loadp;
  ld.addEventListener('click', () => { const p = readJSON('kc_profile_' + sel.value); if (p) { prefs = sane(p); applyPrefs(); buildCtl(); } });
  const rs = document.createElement('button'); rs.type = 'button'; rs.className = 'chip'; rs.id = 'profreset'; rs.textContent = U.reset;
  rs.addEventListener('click', () => { prefs = sane({}); applyPrefs(); buildCtl(); });
  row.appendChild(sel); row.appendChild(sv); row.appendChild(ld); row.appendChild(rs); box.appendChild(row);
}


/* ---- match feed from the PC: dashboard + mini-map + event vibration (display only, never sent back) ----
   Every number comes from the PC's `state` / `event` frames (KingControllerFeed). Text is set with textContent only. */
let feedState = null; const feedEvents = [];
const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : (d || 0);
const pair = (a, d) => Array.isArray(a) && a.length >= 2 ? [num(a[0], d), num(a[1], d)] : [d || 0, d || 0];
function onFeedState(m){
  feedState = {clock: String(m.clock || '').slice(0, 8), score: pair(m.score), poss: pair(m.poss, 50), shots: pair(m.shots), sot: pair(m.sot),
    cards: Array.isArray(m.cards) ? m.cards.map(x => num(x)).slice(0, 4) : [0,0,0,0], half: num(m.half, 1),
    ball: pair(m.ball), me: (Array.isArray(m.me) ? m.me : []).slice(0, 44).map(x => num(x)), opp: (Array.isArray(m.opp) ? m.opp : []).slice(0, 44).map(x => num(x))};
  if ($('dash').classList.contains('show')) renderDash();
}
function eventText(e){
  const k = {goal:e.own_goal ? T.ui.owng : T.ui.goal, yellow_card:T.ui.yel, red_card:T.ui.redc, substitution:T.ui.subst, save:T.ui.saved, penalty_kick:T.ui.pen}[e.kind] || '';
  return Math.floor(num(e.minute)) + "' " + k + (e.player ? ' — ' + String(e.player).slice(0, 24) : '');
}
function onFeedEvent(m){
  const e = {kind: String(m.kind || ''), minute: num(m.minute), mine: !!m.mine, player: String(m.player || '').slice(0, 40), own_goal: !!m.own_goal};
  if (!e.kind) return;
  feedEvents.push(e); if (feedEvents.length > 6) feedEvents.shift();
  if (e.kind === 'goal') buzz(e.mine !== e.own_goal ? 'goal' : 'concede');
  else if (e.kind === 'red_card') buzz('long');
  else if (e.kind === 'yellow_card' && e.mine) buzz();
  if ($('dash').classList.contains('show')) renderDash();
}
function renderDash(){
  const U = T.ui, f = feedState;
  $('dempty').textContent = U.nomatch;
  $('dempty').style.display = f ? 'none' : '';
  $('dcol').style.display = f ? 'flex' : 'none'; $('dmapwrap').style.display = f ? 'flex' : 'none';
  if (!f) return;
  $('dscore').textContent = f.score[0] + ' - ' + f.score[1];
  $('dclock').textContent = f.clock + ' · ' + U.youl + ' ' + f.score[0];
  $('dposs').firstElementChild.style.width = Math.max(0, Math.min(100, f.poss[0])) + '%';
  $('dp1').textContent = f.poss[0] + '%'; $('dplab').textContent = U.possl; $('dp2').textContent = f.poss[1] + '%';
  $('ds1').textContent = f.shots[0] + ' (' + f.sot[0] + ')'; $('dslab').textContent = U.shotsl; $('ds2').textContent = f.shots[1] + ' (' + f.sot[1] + ')';
  $('dc1').textContent = '🟨' + f.cards[0] + ' 🟥' + f.cards[1]; $('dclab').textContent = U.cardsl; $('dc2').textContent = '🟨' + f.cards[2] + ' 🟥' + f.cards[3];
  const feed = $('dfeed'); feed.textContent = '';
  for (const e of feedEvents.slice().reverse()) { const d = document.createElement('div'); d.textContent = (e.mine ? '● ' : '○ ') + eventText(e); feed.appendChild(d); }
  drawMap(f);
}
function drawMap(f){
  const c = $('dmap'), g = c.getContext('2d'), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H); g.fillStyle = '#0e2a12'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.5; g.strokeRect(4, 4, W - 8, H - 8);
  g.beginPath(); g.moveTo(4, H / 2); g.lineTo(W - 4, H / 2); g.stroke();
  g.beginPath(); g.arc(W / 2, H / 2, W * 0.14, 0, 6.2832); g.stroke();
  g.strokeRect(W * 0.28, 4, W * 0.44, H * 0.11); g.strokeRect(W * 0.28, H - 4 - H * 0.11, W * 0.44, H * 0.11);
  const X = x => (W / 2) + Math.max(-1.1, Math.min(1.1, x)) * (W / 2 - 4), Y = y => (H / 2) - Math.max(-1.1, Math.min(1.1, y)) * (H / 2 - 4);
  const dots = (a, col) => { g.fillStyle = col; for (let i = 0; i + 1 < a.length; i += 2) { g.beginPath(); g.arc(X(a[i]), Y(a[i + 1]), 4, 0, 6.2832); g.fill(); } };
  dots(f.opp, '#c0272d'); dots(f.me, '#d4af37');
  g.fillStyle = '#fff'; g.beginPath(); g.arc(X(f.ball[0]), Y(f.ball[1]), 3.2, 0, 6.2832); g.fill();
}
$('dashbtn').addEventListener('click', () => { const d = $('dash'); d.classList.toggle('show'); $('dashbtn').classList.toggle('on', d.classList.contains('show')); closeSettings(); if (d.classList.contains('show')) renderDash(); });

/* ---- chrome ---- */
for (const l of ['en','de','ar']) {
  const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.dataset.l = l; b.textContent = I18N[l].name;
  b.addEventListener('click', () => setLang(l)); $('langs').appendChild(b);
}
$('disc').addEventListener('click', userDisconnect);
$('ovact').addEventListener('click', userReconnect);
applyLang();
applyPrefs();
connect();
</script>
